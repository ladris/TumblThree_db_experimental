<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Gallery for {{ blog.name }} - TumblThree-py</title>
    <style>
        body { font-family: sans-serif; }
        .container { width: 80%; margin: auto; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
        .gallery-item img { max-width: 100%; height: auto; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Gallery for {{ blog.name }}</h1>
        <p><a href="{{ url_for('index') }}">Back to Blog List</a></p>
        <div class="gallery">
            {% for post in blog.posts %}
                {% for file in post.files %}
                    <div class="gallery-item">
                        <a href="{{ url_for('static', filename='downloads/' + blog.name + '/' + file.filename) }}" target="_blank">
                            <img src="{{ url_for('static', filename='downloads/' + blog.name + '/' + file.filename) }}" alt="{{ file.filename }}">
                        </a>
                        <p>
                            <a href="{{ post.post_url }}" target="_blank">Post {{ post.id }}</a>
                        </p>
                    </div>
                {% endfor %}
            {% endfor %}
        </div>
    </div>
</body>
</html>
