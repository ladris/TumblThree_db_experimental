<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Settings for {{ blog.name }}</title>
    <style>
        body { font-family: sans-serif; }
        .container { width: 80%; margin: auto; }
        .form-group { margin-bottom: 1rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Settings for {{ blog.name }}</h1>
        <form action="{{ url_for('settings', blog_id=blog.id) }}" method="post">
            <div class="form-group">
                <label for="download_photo">Download Photos</label>
                <input type="checkbox" id="download_photo" name="download_photo" {% if blog.download_photo %}checked{% endif %}>
            </div>
            <div class="form-group">
                <label for="download_video">Download Videos</label>
                <input type="checkbox" id="download_video" name="download_video" {% if blog.download_video %}checked{% endif %}>
            </div>
            <div class="form-group">
                <label for="tags">Tags (comma-separated)</label>
                <input type="text" id="tags" name="tags" value="{{ blog.tags or '' }}">
            </div>
            <input type="submit" value="Save Settings">
        </form>
        <p><a href="{{ url_for('index') }}">Back to dashboard</a></p>
    </div>
</body>
</html>
