[project]
name = "tumblthree"
version = "0.1.0"
description = "TumblThree — social media backup tool with a local SQLite database and a browser UI"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
tumblthree = "tumblthree.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tumblthree*"]
